name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      camera:
        description: "Camera rep counter (adds Google ML Kit pose detection) - experimental"
        type: boolean
        default: false
      widget:
        description: "Home screen widget - experimental"
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android
          df -h /
      - uses: actions/checkout@v4
      - name: Check the files in the repo
        working-directory: SoloSystem/SoloSystem
        run: |
          missing=0
          {
            echo "### Files in SoloSystem/SoloSystem"
            echo ""
            echo "| File | Status |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in main.py app_main.py engine.py loader.py updater.py service.py service_main.py notifier.py reps.py camera_pose.py runtrack.py p4a_widget_hook.py buildozer.spec icon.png presplash.png; do
            if [ -f "$f" ]; then
              echo "OK       $f ($(wc -c < "$f") bytes)"
              echo "| $f | OK ($(wc -c < "$f") bytes) |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "MISSING  $f"
              echo "| $f | **MISSING** |" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done
          build=$(grep -o 'Build [0-9][0-9.]* (%s)' app_main.py | head -1 | sed 's/ (%s)//')
          diag=$(grep -c "def diagnose" camera_pose.py || true)
          echo "app_main.py says: ${build:-no build number}"
          echo "camera_pose.py has diagnose(): $diag (1 = newest)"
          { echo ""; echo "app_main.py says **${build:-no build number}**. camera_pose.py newest: **$diag** (1 = yes, 0 = old copy)"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$missing" = "1" ]; then echo "::warning::Some files are missing from SoloSystem/SoloSystem - upload them from the newest zip"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore
            echo "Permanent signing key restored."
          else
            echo "::warning::Secret DEBUG_KEYSTORE_B64 not found - this build gets a temporary key and cannot update the installed app."
          fi
      - name: Apply optional features
        working-directory: SoloSystem/SoloSystem
        env:
          CAMERA: ${{ inputs.camera }}
          WIDGET: ${{ inputs.widget }}
        run: |
          if [ "$CAMERA" = "true" ]; then
            sed -i '/^android.archs/a android.enable_androidx = True\nandroid.gradle_dependencies = com.google.mlkit:pose-detection:18.0.0-beta4' buildozer.spec
            echo "Camera rep counter: ML Kit pose detection added"
          fi
          if [ "$WIDGET" = "true" ]; then
            sed -i '/^android.archs/a p4a.hook = p4a_widget_hook.py' buildozer.spec
            echo "Home screen widget: build hook added"
          fi
          grep -n "gradle_dependencies\|p4a.hook\|enable_androidx" buildozer.spec || echo "No optional features: standard build"
      - name: Build APK
        shell: bash
        working-directory: SoloSystem/SoloSystem
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          buildozer -v android debug 2>&1 | tee build.log
      - name: Show signing key of the APK
        working-directory: SoloSystem/SoloSystem
        run: |
          keytool -printcert -jarfile bin/*.apk | grep -E "Owner|SHA256" || true
      - name: Show Gradle error
        if: failure()
        working-directory: SoloSystem/SoloSystem
        run: |
          grep -n -B3 -A20 "What went wrong" build.log | tail -n 80 || true
          echo "===== other key lines ====="
          grep -n "Execution failed\|BUILD FAILED\|requires Java\|Unsupported\|Could not" build.log | tail -n 20 || true
      - name: Save full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: SoloSystem/SoloSystem/build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (inputs.camera || inputs.widget) && 'TheSystem-apk-experimental' || 'TheSystem-apk' }}
          path: SoloSystem/SoloSystem/bin/*.apk
