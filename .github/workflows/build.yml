name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore
            echo "Permanent signing key restored."
          else
            echo "::warning::Secret DEBUG_KEYSTORE_B64 not found - this build gets a temporary key and cannot update the installed app."
          fi
      - name: Build APK
        shell: bash
        working-directory: SoloSystem/SoloSystem
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          buildozer -v android debug 2>&1 | tee build.log
      - name: Show signing key of the APK
        working-directory: SoloSystem/SoloSystem
        run: |
          keytool -printcert -jarfile bin/*.apk | grep -E "Owner|SHA256" || true
      - name: Show Gradle error
        if: failure()
        working-directory: SoloSystem/SoloSystem
        run: |
          grep -n -B3 -A20 "What went wrong" build.log | tail -n 80 || true
          echo "===== other key lines ====="
          grep -n "Execution failed\|BUILD FAILED\|requires Java\|Unsupported\|Could not" build.log | tail -n 20 || true
      - name: Save full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: SoloSystem/SoloSystem/build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheSystem-apk
          path: SoloSystem/SoloSystem/bin/*.apk
