name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
      - name: Build APK
        shell: bash
        working-directory: SoloSystem/SoloSystem
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Show the real error
        if: failure()
        working-directory: SoloSystem/SoloSystem
        run: |
          n=$(grep -n "ENVIRONMENT" build.log | tail -1 | cut -d: -f1)
          [ -z "$n" ] && n=$(wc -l < build.log)
          start=$((n-70)); [ $start -lt 1 ] && start=1
          echo "===== 70 lines before the environment dump ====="
          sed -n "${start},$((n-1))p" build.log
          echo "===== key error lines ====="
          grep -n "Command failed\|Traceback\|ModuleNotFoundError\|No such file\|undefined reference\|FAILED" build.log | tail -n 20
      - name: Save full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: SoloSystem/SoloSystem/build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheSystem-apk
          path: SoloSystem/SoloSystem/bin/*.apk
